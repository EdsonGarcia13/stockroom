{% macro icon(name) %}
  <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
    {% if name == 'search' %}
      <circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>
    {% elif name == 'category' %}
      <path d="M3 4h7l10 10-6 6L3 9z"/><path d="M7 8h.01"/>
    {% elif name == 'arrow' %}
      <path d="m11 6-6 6 6 6M5 12h14"/>
    {% elif name == 'cart' %}
      <path d="M2 3h3l3 12h11l2-8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>
    {% elif name == 'check' %}
      <circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>
    {% elif name == 'Electronics' %}
      <rect x="4" y="5" width="16" height="12" rx="2"/><path d="M9 20h6m-3-3v3"/>
    {% elif name == 'Accessories' %}
      <path d="M4 9h16l1 12H3L4 9Z M8 10V7a4 4 0 0 1 8 0v3"/>
    {% elif name == 'Home & Office' %}
      <path d="m3 11 9-8 9 8M5 10v10h14V10m-9 10v-6h4v6"/>
    {% elif name == 'Beauty' %}
      <path d="M12 3c0 3-5 6-5 10a5 5 0 0 0 10 0c0-4-5-7-5-10Z M10 15c.4 1 1 1.5 2 1.5"/>
    {% else %}
      <path d="M12 2.5 21 7v10l-9 4.5L3 17V7l9-4.5Z M3 7l9 4.5L21 7 M12 11.5v10 M7.5 4.75l9 4.5"/>
    {% endif %}
  </svg>
{% endmacro %}
